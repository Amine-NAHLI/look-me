services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lookme
      POSTGRES_USER: lookme
      POSTGRES_PASSWORD: lookme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookme -d lookme"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://lookme:lookme@postgres:5432/lookme?schema=public
      JWT_ACCESS_SECRET: change-this-local-access-secret-before-production-123
      JWT_REFRESH_SECRET: change-this-local-refresh-secret-before-production-456
      CLIENT_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node server.js"
    ports: ["5000:5000"]

  frontend:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:8080"]

volumes:
  postgres_data:
