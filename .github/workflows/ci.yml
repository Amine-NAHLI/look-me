name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lookme_test
          POSTGRES_USER: lookme
          POSTGRES_PASSWORD: lookme
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lookme -d lookme_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lookme:lookme@127.0.0.1:5432/lookme_test?schema=public
      CLIENT_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      JWT_ACCESS_SECRET: ci-access-secret-that-is-longer-than-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-longer-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |-
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install API
        run: npm ci
        working-directory: backend
      - name: Validate API schema and run tests
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run check
          npm test
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Lint and build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run build
      - name: Dependency audit
        run: |
          npm audit --omit=dev --audit-level=high --prefix backend
          npm audit --omit=dev --audit-level=high --prefix frontend
      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@v2
