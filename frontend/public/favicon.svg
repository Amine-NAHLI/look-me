<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Fond premium sombre -->
  <rect width="512" height="512" rx="120" fill="#0A0A0A" />
  
  <!-- Ligne décorative (Orbe Aurora) -->
  <circle cx="256" cy="256" r="180" fill="#C2185B" opacity="0.15" filter="blur(20px)" />
  
  <!-- Texte LM stylisé, rappelant la typographie Playfair Display -->
  <text x="50%" y="54%" font-family="'Playfair Display', serif, 'Times New Roman'" font-size="280" font-weight="bold" font-style="italic" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" letter-spacing="-10">
    L
  </text>
  
  <!-- Étoile d'éclat (sparkle) pour l'effet luxe -->
  <path d="M 360 180 Q 360 140 400 140 Q 360 140 360 100 Q 360 140 320 140 Q 360 140 360 180" fill="#C2185B" opacity="0.8" />
</svg>